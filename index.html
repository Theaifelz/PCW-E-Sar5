        .block-theme-gold { background: linear-gradient(135deg, #fefce8, #fef9c3); border-color: #f59e0b; color: #713f12; }
        .block-theme-teal { background: linear-gradient(135deg, #f0fdfa, #ccfbf1); border-color: #14b8a6; color: #134e4a; }
        .block-theme-lavender { background: linear-gradient(135deg, #faf5ff, #f3e8ff); border-color: #a855f7; color: #581c87; }
        .block-theme-rose { background: linear-gradient(135deg, #fff1f2, #ffe4e6); border-color: #f43f5e; color: #881337; }
        .block-theme-ocean { background: linear-gradient(135deg, #f0f9ff, #e0f2fe); border-color: #0284c7; color: #0c4a6e; }
        .block-theme-sunset { background: linear-gradient(135deg, #fff7ed, #ffedd5); border-color: #f97316; color: #7c2d12; }

    <script>
        const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwTIoD9LfLqCtMp7E9o4kTYDONctTsXYT4lkQ13D3T8xv6ysmjy0fHdn8Kls-7gGEpA/exec";

        let activeStandardId = 1;
        let isLandscapeMode = false;
        let activeLightboxImages = [];
        let activeLightboxIndex = 0;

        const DEFAULT_DRIVE_LINK = "https://drive.google.com/file/d/1BpyjO5UApn25F6n00DqNEp134S8-Tq1-/view";

        let headerSettings = {
            schoolName: "โรงเรียนปากชมวิทยา",
            schoolLogo: "",
            headerTitle: "ระบบการประเมินคุณภาพภายนอก สมศ. รอบ 5",
            headerSubtitle: "ศูนย์ข้อมูลเอกสารและหลักฐานเชิงประจักษ์ดิจิทัล"
        };

        let welcomeBlocks = [];

        const defaultSarData = {
            '1': [
                {
                    title: "1.1 ผลสัมฤทธิ์ทางการเรียนของผู้เรียน",
                    documents: [
                        { name: "เล่มรายงานสรุปผลสัมฤทธิ์ทางการเรียน 3 ปีการศึกษาย้อนหลัง", url: DEFAULT_DRIVE_LINK, images: [] },
                        { name: "รายงานสรุปผลการประเมินการอ่าน คิดวิเคราะห์ และเขียน", url: DEFAULT_DRIVE_LINK, images: [] }
                    ]
                }
            ],
            '2': [
                {
                    title: "2.1 การกำหนดเป้าหมาย วิสัยทัศน์ และพันธกิจของสถานศึกษา",
                    documents: [
                        { name: "แผนพัฒนาคุณภาพการศึกษา 4 ปี (พ.ศ. 2566 - 2569)", url: DEFAULT_DRIVE_LINK, images: [] }
                    ]
                }
            ],
            '3': [
                {
                    title: "3.1 จัดการเรียนรู้ผ่านกระบวนการคิดและปฏิบัติจริง (Active Learning)",
                    documents: [
                        { name: "ตัวอย่างแผนการจัดการเรียนรู้ที่เน้นผู้เรียนเป็นสำคัญ", url: DEFAULT_DRIVE_LINK, images: [] }
                    ]
                }
            ]
        };

        let sarData = JSON.parse(JSON.stringify(defaultSarData));

        function convertDriveImageUrl(url) {
            if (!url || typeof url !== 'string') return '';
            const trimmed = url.trim();
            if (!trimmed) return '';
            if (trimmed.startsWith('data:image/') || trimmed.startsWith('blob:')) return trimmed;
            const match = trimmed.match(/\/d\/([a-zA-Z0-9_-]+)/) || trimmed.match(/id=([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://lh3.googleusercontent.com/d/${match[1]}`;
            }
            return trimmed;
        }

        function convertYouTubeEmbedUrl(url) {
            if (!url || typeof url !== 'string') return '';
            const trimmed = url.trim();
            if (!trimmed) return '';

            let videoId = "";
            if (trimmed.includes("youtu.be/")) {
                videoId = trimmed.split("youtu.be/")[1].split("?")[0].split("&")[0];
            } else if (trimmed.includes("youtube.com/watch")) {
                const urlObj = new URL(trimmed);
                videoId = urlObj.searchParams.get("v");
            } else if (trimmed.includes("youtube.com/embed/")) {
                videoId = trimmed.split("youtube.com/embed/")[1].split("?")[0].split("&")[0];
            } else if (trimmed.includes("youtube.com/shorts/")) {
                videoId = trimmed.split("youtube.com/shorts/")[1].split("?")[0].split("&")[0];
            }

            if (videoId) {
                return `https://www.youtube.com/embed/${videoId}?autoplay=0&rel=0`;
            }
            return trimmed;
        }

        function convertDrivePreviewUrl(url) {
            if (!url || typeof url !== 'string') return '';
            const trimmed = url.trim();
            if (!trimmed) return '';

            if (trimmed.includes("youtube.com") || trimmed.includes("youtu.be")) {
                return convertYouTubeEmbedUrl(trimmed);
            }

            const match = trimmed.match(/\/d\/([a-zA-Z0-9_-]+)/) || trimmed.match(/id=([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://drive.google.com/file/d/${match[1]}/preview`;
            }

            if (trimmed.match(/\.(xlsx|xls|docx|doc|pptx|ppt)$/i)) {
                return `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(trimmed)}`;
            }

            return trimmed;
        }

        function isVideoUrl(url) {
            if (!url || typeof url !== 'string') return false;
            const trimmed = url.toLowerCase().trim();
            return trimmed.endsWith('.mp4') || trimmed.endsWith('.webm') || trimmed.endsWith('.mov') || trimmed.startsWith('data:video/') || trimmed.startsWith('blob:');
        }

        async function fetchSheetData() {
            if (!GOOGLE_SHEET_API_URL || GOOGLE_SHEET_API_URL.includes("YOUR_APPS_SCRIPT_ID")) {
                return;
            }
            try {
                const response = await fetch(GOOGLE_SHEET_API_URL);
                const data = await response.json();
                
                if (data && data.status === "success") {
                    delete data.status;

                    let updated = false;

                    if (data['1'] || data['2'] || data['3']) {
                        const newSar = { '1': data['1'] || [], '2': data['2'] || [], '3': data['3'] || [] };
                        if (JSON.stringify(newSar) !== JSON.stringify(sarData)) {
                            sarData = newSar;
                            localStorage.setItem("sar_data_config", JSON.stringify(sarData));
                            updated = true;
                        }
                    }

                    if (data.headerSettings) {
                        if (JSON.stringify(data.headerSettings) !== JSON.stringify(headerSettings)) {
                            headerSettings = data.headerSettings;
                            localStorage.setItem("site_header_config", JSON.stringify(headerSettings));
                            updated = true;
                        }
                    }

                    if (data.welcomeBlocks) {
                        if (JSON.stringify(data.welcomeBlocks) !== JSON.stringify(welcomeBlocks)) {
                            welcomeBlocks = data.welcomeBlocks;
                            localStorage.setItem("site_welcome_blocks_config", JSON.stringify(welcomeBlocks));
                            updated = true;
                        }
                    }

                    if (updated) {
                        loadHeaderSettings();
                        renderWelcomeBlocks();
                        renderStandard(activeStandardId);
                    }
                }
            } catch (error) {
                console.error("❌ ไม่สามารถดึงข้อมูลจาก Google Sheets ได้:", error);
            }
        }

        function setupAutoRefresh() {
            window.addEventListener("storage", function(event) {
                if (event.key === "sar_data_config" || event.key === "site_header_config" || event.key === "site_welcome_blocks_config") {
                    const savedHeader = localStorage.getItem("site_header_config");
                    if (savedHeader) try { headerSettings = JSON.parse(savedHeader); } catch(e){}
                    const savedBlocks = localStorage.getItem("site_welcome_blocks_config");
                    if (savedBlocks) try { welcomeBlocks = JSON.parse(savedBlocks); } catch(e){}
                    const savedSar = localStorage.getItem("sar_data_config");
                    if (savedSar) try { sarData = JSON.parse(savedSar); } catch(e){}

                    loadHeaderSettings();
                    renderWelcomeBlocks();
                    renderStandard(activeStandardId);
                }
            });

            document.addEventListener("visibilitychange", function() {
                if (document.visibilityState === "visible") {
                    fetchSheetData();
                }
            });

            setInterval(fetchSheetData, 12000);
        }

        function loadHeaderSettings() {
            const savedHeader = localStorage.getItem("site_header_config");
            if (savedHeader) {
                try { headerSettings = Object.assign(headerSettings, JSON.parse(savedHeader)); } catch (e) {}
            }

            document.getElementById("header-title-display").textContent = headerSettings.headerTitle || "ระบบการประเมินคุณภาพภายนอก สมศ. รอบ 5";
            document.getElementById("header-subtitle-display").textContent = headerSettings.headerSubtitle || "ศูนย์ข้อมูลเอกสารและหลักฐานเชิงประจักษ์ดิจิทัล";
            document.querySelectorAll("#school-name-text, #footer-school-name").forEach(el => el.textContent = headerSettings.schoolName || "โรงเรียนปากชมวิทยา");

            const logoImg = document.getElementById("logo-image-display");
            const logoFallback = document.getElementById("logo-icon-fallback");

            if (logoImg && logoFallback) {
                const convertedLogo = convertDriveImageUrl(headerSettings.schoolLogo);
                if (convertedLogo && convertedLogo.trim() !== "") {
                    logoImg.src = convertedLogo;
                    logoImg.classList.remove("hidden");
                    logoFallback.classList.add("hidden");
                } else {
                    logoImg.classList.add("hidden");
                    logoFallback.classList.remove("hidden");
                }
            }
        }

        function renderWelcomeBlocks() {
            const container = document.getElementById('welcome-blocks-container');
            if (!container) return;
            container.innerHTML = "";

            const savedBlocks = localStorage.getItem("site_welcome_blocks_config");
            if (savedBlocks) {
                try { welcomeBlocks = JSON.parse(savedBlocks); } catch (e) {}
            }

            if (!Array.isArray(welcomeBlocks) || welcomeBlocks.length === 0) {
                container.classList.add('hidden');
                return;
            }
            container.classList.remove('hidden');

            welcomeBlocks.forEach(block => {
                const blockTheme = block.style || 'lime';
                const div = document.createElement('div');
                div.className = `p-5 rounded-3xl border-2 border-white sticker-card block-theme-${blockTheme} space-y-2.5 transition-all duration-300`;

                let innerHtml = `
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-2xl bg-white/80 flex items-center justify-center text-base shadow-sm border border-white">
                            <i class="fa-solid ${block.icon || 'fa-bullhorn'}"></i>
                        </div>
                        <div>
                            <span class="text-[10px] uppercase font-extrabold tracking-wider opacity-80">${block.subtitle || 'สารสนเทศ'}</span>
                            <h3 class="font-extrabold text-xs md:text-sm leading-tight">${block.title || ''}</h3>
                        </div>
                    </div>
                    ${block.body ? `<p class="text-xs md:text-sm font-medium leading-relaxed opacity-90 whitespace-pre-line">${block.body}</p>` : ''}
                `;

                let imagesList = [];
                if (Array.isArray(block.images) && block.images.length > 0) {
                    imagesList = block.images;
                } else if (block.imageUrl) {
                    imagesList = [block.imageUrl];
                }

                if (block.type === 'image' && imagesList.length > 0) {
                    if (imagesList.length === 1) {
                        innerHtml += `
                            <div class="rounded-2xl overflow-hidden border border-white/50 max-h-72 bg-black/5 flex items-center justify-center cursor-pointer group relative" onclick='openLightbox(${JSON.stringify(imagesList)}, 0)'>
                                <img src="${convertDriveImageUrl(imagesList[0])}" class="max-h-72 w-auto object-contain rounded-2xl group-hover:scale-105 transition-transform duration-300">
                                <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white text-xl">
                                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                                </div>
                            </div>
                        `;
                    } else {
                        let galleryHtml = `<div class="grid grid-cols-2 gap-2.5 pt-1">`;
                        imagesList.forEach((imgUrl, imgIdx) => {
                            galleryHtml += `
                                <div class="rounded-xl overflow-hidden border border-white/60 aspect-video bg-black/5 cursor-pointer group relative shadow-sm" onclick='openLightbox(${JSON.stringify(imagesList)}, ${imgIdx})'>
                                    <img src="${convertDriveImageUrl(imgUrl)}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                                    <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white text-base">
                                        <i class="fa-solid fa-magnifying-glass-plus"></i>
                                    </div>
                                </div>
                            `;
                        });
                        galleryHtml += `</div>`;
                        innerHtml += galleryHtml;
                    }
                } else if (block.type === 'vtr' && block.videoUrl) {
                    let embedUrl = convertYouTubeEmbedUrl(block.videoUrl);
                    if (isVideoUrl(block.videoUrl)) {
                        innerHtml += `
                            <div class="aspect-video w-full rounded-2xl overflow-hidden border border-white/50 bg-black shadow-md flex items-center justify-center">
                                <video controls class="w-full h-full object-contain">
                                    <source src="${block.videoUrl}">
                                </video>
                            </div>
                        `;
                    } else {
                        innerHtml += `
                            <div class="aspect-video w-full rounded-2xl overflow-hidden border border-white/50 bg-black shadow-md">
                                <iframe src="${embedUrl}" class="w-full h-full border-0" allowfullscreen></iframe>
                            </div>
                        `;
                    }
                }

                if (block.showBtn && block.btnLabel && block.btnUrl) {
                    innerHtml += `
                        <div class="pt-1">
                            <a href="${block.btnUrl}" target="_blank" class="inline-flex items-center gap-2 px-4 py-2 bg-white text-slate-800 rounded-xl text-xs font-bold shadow-md hover:bg-slate-50 transition-all border border-slate-100">
                                <span>${block.btnLabel}</span> <i class="fa-solid fa-arrow-right"></i>
                            </a>
                        </div>
                    `;
                }

                div.innerHTML = innerHtml;
                container.appendChild(div);
            });
        }

        function switchTab(tabId) {
            activeStandardId = tabId;
            
            const configs = {
                1: { border: 'border-[#a855f7]', hoverBorder: 'hover:border-[#9333ea]', activeBg: 'bg-[#faf5ff]' },
                2: { border: 'border-[#f59e0b]', hoverBorder: 'hover:border-[#d97706]', activeBg: 'bg-[#fefce8]' },
                3: { border: 'border-[#14b8a6]', hoverBorder: 'hover:border-[#0d9488]', activeBg: 'bg-[#f0fdfa]' }
            };

            for (let id = 1; id <= 3; id++) {
                const btn = document.getElementById(`tab-btn-${id}`);
                const cfg = configs[id];
                if (id === tabId) {
                    btn.className = `tab-btn group p-3.5 rounded-2xl ${cfg.activeBg} border-l-8 ${cfg.border} border-t border-r border-b shadow-lg text-left flex items-center gap-3 transition-all duration-300`;
                } else {
                    btn.className = `tab-btn group p-3.5 rounded-2xl bg-white border-l-8 ${cfg.border} ${cfg.hoverBorder} border-t border-r border-b border-slate-200 shadow-md text-left flex items-center gap-3 opacity-90 hover:opacity-100 hover:bg-slate-50 transition-all duration-300`;
                }
            }

            renderStandard(tabId);
        }

        function toggleAccordion(id) {
            const content = document.getElementById(`content-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            if (content && icon) {
                content.classList.toggle('hidden');
                icon.classList.toggle('rotate-180');
            }
        }

        function renderStandard(standardId) {
            const container = document.getElementById('accordion-container');
            if (!container) return;
            container.innerHTML = '';
            const key = String(standardId);
            const targetData = sarData[key] || [];

            const themeConfigs = {
                '1': { borderLeft: 'border-[#a855f7]', headerBg: 'bg-[#faf5ff]', badgeBg: 'bg-[#f3e8ff] text-[#581c87] border-[#e9d5ff]', iconColor: 'text-[#7e22ce]', iconBorder: 'border-[#a855f7]', btnBg: 'bg-[#9333ea] hover:bg-[#7e22ce]' },
                '2': { borderLeft: 'border-[#f59e0b]', headerBg: 'bg-[#fefce8]', badgeBg: 'bg-[#fef9c3] text-[#713f12] border-[#fde047]', iconColor: 'text-[#b45309]', iconBorder: 'border-[#f59e0b]', btnBg: 'bg-[#d97706] hover:bg-[#b45309]' },
                '3': { borderLeft: 'border-[#14b8a6]', headerBg: 'bg-[#f0fdfa]', badgeBg: 'bg-[#ccfbf1] text-[#134e4a] border-[#99f6e4]', iconColor: 'text-[#0f766e]', iconBorder: 'border-[#14b8a6]', btnBg: 'bg-[#0d9488] hover:bg-[#0f766e]' }
            };

            const cfg = themeConfigs[key] || themeConfigs['1'];

            targetData.forEach((item, topicIndex) => {
                const uniqueId = `std-${standardId}-${topicIndex}`;
                const itemDiv = document.createElement('div');
                itemDiv.className = `bg-white border-l-8 ${cfg.borderLeft} border-t border-r border-b border-slate-200 rounded-3xl overflow-hidden sticker-card mb-3 transition-all duration-300 animate-card-fade accordion-card-hover`;
                
                const docs = Array.isArray(item.documents) ? item.documents : [];
                const docRows = docs.map((doc) => `
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-3 bg-white border border-slate-100 rounded-2xl gap-2 hover:bg-slate-50/80 transition-colors">
                        <span class="text-xs md:text-sm text-slate-700 font-bold flex items-center flex-wrap gap-1">
                            <i class="fa-solid fa-file-pdf text-rose-500 mr-1.5 text-base"></i>${doc.name}
                            ${doc.images && doc.images.length > 0 ? `<span class="ml-1 text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md font-normal"><i class="fa-solid fa-images mr-1"></i>${doc.images.length} รูป</span>` : ''}
                        </span>
                        
                        <div class="flex items-center gap-2 self-end sm:self-auto flex-shrink-0">
                            <button onclick="openPdfModal('${standardId}', ${topicIndex})" class="px-3.5 py-1.5 ${cfg.btnBg} text-white text-xs font-bold rounded-xl transition-all shadow-sm flex items-center gap-1.5 hover:shadow-md">
                                <i class="fa-solid fa-eye"></i> เปิดดูเอกสาร
                            </button>
                        </div>
                    </div>
                `).join('');

                itemDiv.innerHTML = `
                    <div class="w-full flex justify-between items-center p-4 font-bold text-slate-800 ${cfg.headerBg} cursor-pointer border-b border-emerald-100" onclick="toggleAccordion('${uniqueId}')">
                        <div class="flex items-center gap-3">
                            <i id="icon-${uniqueId}" class="fa-solid fa-chevron-down ${cfg.iconColor} bg-white p-2 rounded-full text-xs border-2 ${cfg.iconBorder} transition-transform"></i>
                            <span class="text-xs md:text-sm text-slate-800 font-extrabold">${item.title}</span>
                        </div>
                        <span class="text-[11px] ${cfg.badgeBg} font-bold px-3 py-1 rounded-full border">${docs.length} รายการ</span>
                    </div>
                    <div id="content-${uniqueId}" class="hidden border-t border-emerald-200/80 bg-[#f8fafc] p-4 space-y-2">
                        ${docs.length > 0 ? docRows : '<p class="text-xs text-slate-400 font-bold text-center py-2">ยังไม่มีไฟล์เอกสารในกลุ่มหัวข้อนี้</p>'}
                    </div>
                `;
                container.appendChild(itemDiv);
            });
        }

        function setPortraitMode() {
            isLandscapeMode = false;
            const box = document.getElementById('modal-container-box');
            const btnText = document.getElementById('btn-toggle-landscape-text');
            const btnIcon = document.getElementById('btn-toggle-landscape-icon');
            
            if (box) {
                box.classList.remove('max-w-7xl');
                box.classList.add('max-w-4xl');
            }
            if (btnText) btnText.textContent = "เอกสารแนวนอน (Landscape)";
            if (btnIcon) btnIcon.className = "fa-solid fa-expand";
        }

        function toggleLandscapeView() {
            isLandscapeMode = !isLandscapeMode;
            const box = document.getElementById('modal-container-box');
            const btnText = document.getElementById('btn-toggle-landscape-text');
            const btnIcon = document.getElementById('btn-toggle-landscape-icon');

            if (isLandscapeMode) {
                box.classList.remove('max-w-4xl');
                box.classList.add('max-w-7xl');
                if (btnText) btnText.textContent = "เอกสารแนวตั้ง (Portrait)";
                if (btnIcon) btnIcon.className = "fa-solid fa-compress";
            } else {
                box.classList.remove('max-w-7xl');
                box.classList.add('max-w-4xl');
                if (btnText) btnText.textContent = "เอกสารแนวนอน (Landscape)";
                if (btnIcon) btnIcon.className = "fa-solid fa-expand";
            }
        }

        function openPdfModal(standardId, topicIndex) {
            setPortraitMode();

            const key = String(standardId);
            const topic = sarData[key][topicIndex];
            if (!topic || !topic.documents) return;

            const docs = topic.documents;
            document.getElementById('modal-topic-title').textContent = topic.title || "ประเด็นพิจารณา";
            document.getElementById('modal-doc-count-subtitle').textContent = `จำนวนเอกสารทั้งหมด ${docs.length} รายการ`;

            const stackContainer = document.getElementById('modal-documents-stack');
            stackContainer.innerHTML = "";

            let allAttachedImages = [];

            docs.forEach((doc, idx) => {
                const previewUrl = convertDrivePreviewUrl(doc.url);
                const docCard = document.createElement('div');
                docCard.className = "bg-white p-4 rounded-2xl border-2 border-[#84cc16] shadow-sm space-y-3";

                let mediaHtml = "";
                if (isVideoUrl(doc.url)) {
                    mediaHtml = `
                        <div class="w-full h-[50vh] min-h-[350px] rounded-2xl overflow-hidden border border-slate-200 bg-black shadow-inner flex items-center justify-center">
                            <video controls class="w-full h-full object-contain">
                                <source src="${doc.url}">
                            </video>
                        </div>
                    `;
                } else {
                    mediaHtml = `
                        <div class="w-full h-[50vh] min-h-[350px] rounded-2xl overflow-hidden border border-slate-200 bg-slate-100 shadow-inner">
                            <iframe class="w-full h-full border-0" src="${previewUrl || 'about:blank'}"></iframe>
                        </div>
                    `;
                }

                docCard.innerHTML = `
                    <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                        <h4 class="font-bold text-xs md:text-sm text-slate-800 flex items-center gap-2">
                            <span class="w-6 h-6 rounded-full bg-[#166534] text-white flex items-center justify-center text-[10px] font-extrabold">${idx + 1}</span>
                            ${doc.name || 'เอกสารหลักฐาน'}
                        </h4>
                        <a href="${doc.url || '#'}" target="_blank" class="px-3 py-1 bg-emerald-50 text-[#166534] hover:bg-emerald-100 rounded-xl text-xs font-bold transition-all flex items-center gap-1">
                            <i class="fa-solid fa-up-right-from-square"></i> เปิดลิงก์แยก
                        </a>
                    </div>
                    ${mediaHtml}
                `;
                stackContainer.appendChild(docCard);

                if (doc.images && Array.isArray(doc.images)) {
                    doc.images.forEach(img => {
                        if (img) allAttachedImages.push(img);
                    });
                }
            });

            const imgSection = document.getElementById('modal-attached-images-section');
            const imgGallery = document.getElementById('modal-images-gallery');
            imgGallery.innerHTML = "";

            if (allAttachedImages.length > 0) {
                imgSection.classList.remove('hidden');
                allAttachedImages.forEach((imgUrl, imgIndex) => {
                    const imgDiv = document.createElement('div');
                    imgDiv.className = "rounded-xl overflow-hidden border border-slate-200 aspect-video bg-slate-100 cursor-pointer group shadow-sm hover:border-[#166534] transition-all relative";
                    imgDiv.onclick = () => openLightbox(allAttachedImages, imgIndex);

                    imgDiv.innerHTML = `
                        <img src="${convertDriveImageUrl(imgUrl)}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                        <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white text-lg">
                            <i class="fa-solid fa-magnifying-glass-plus"></i>
                        </div>
                    `;
                    imgGallery.appendChild(imgDiv);
                });
            } else {
                imgSection.classList.add('hidden');
            }

            document.getElementById('pdf-viewer-modal').classList.remove('hidden');
        }

        function closePdfModal() {
            document.getElementById('modal-documents-stack').innerHTML = "";
            document.getElementById('pdf-viewer-modal').classList.add('hidden');
        }

        function handleModalBackdropClick(event) {
            if (event.target.id === 'pdf-viewer-modal') {
                closePdfModal();
            }
        }

        function openLightbox(imagesArray, index) {
            activeLightboxImages = imagesArray;
            activeLightboxIndex = index;
            updateLightboxUI();
            document.getElementById('lightbox-modal').classList.remove('hidden');
        }

        function updateLightboxUI() {
            const imgEl = document.getElementById('lightbox-img');
            const counterEl = document.getElementById('lightbox-counter');
            const prevBtn = document.getElementById('lightbox-prev-btn');
            const nextBtn = document.getElementById('lightbox-next-btn');

            if (!activeLightboxImages || activeLightboxImages.length === 0) return;

            imgEl.src = convertDriveImageUrl(activeLightboxImages[activeLightboxIndex]);
            counterEl.textContent = `${activeLightboxIndex + 1} / ${activeLightboxImages.length}`;

            if (activeLightboxImages.length > 1) {
                prevBtn.classList.remove('hidden');
                nextBtn.classList.remove('hidden');
            } else {
                prevBtn.classList.add('hidden');
                nextBtn.classList.add('hidden');
            }
        }

        function prevLightboxImage() {
            if (activeLightboxImages.length <= 1) return;
            activeLightboxIndex = (activeLightboxIndex - 1 + activeLightboxImages.length) % activeLightboxImages.length;
            updateLightboxUI();
        }

        function nextLightboxImage() {
            if (activeLightboxImages.length <= 1) return;
            activeLightboxIndex = (activeLightboxIndex + 1) % activeLightboxImages.length;
            updateLightboxUI();
        }

        function closeLightbox() {
            const modal = document.getElementById('lightbox-modal');
            if (modal) modal.classList.add('hidden');
            activeLightboxImages = [];
            activeLightboxIndex = 0;
        }

        function handleLightboxBackdropClick(event) {
            if (event.target.id === 'lightbox-modal') {
                closeLightbox();
            }
        }

        document.addEventListener('keydown', function(event) {
            const lightbox = document.getElementById('lightbox-modal');
            const isLightboxOpen = lightbox && !lightbox.classList.contains('hidden');

            if (event.key === 'Escape') {
                if (isLightboxOpen) {
                    closeLightbox();
                } else {
                    closePdfModal();
                }
            } else if (event.key === 'ArrowLeft' && isLightboxOpen) {
                prevLightboxImage();
            } else if (event.key === 'ArrowRight' && isLightboxOpen) {
                nextLightboxImage();
            }
        });

        window.onload = function() {
            const savedHeader = localStorage.getItem("site_header_config");
            if (savedHeader) {
                try { headerSettings = Object.assign(headerSettings, JSON.parse(savedHeader)); } catch (e) {}
            }

            const savedSar = localStorage.getItem("sar_data_config");
            if (savedSar) {
                try { sarData = JSON.parse(savedSar); } catch (e) {}
            }

            loadHeaderSettings();
            renderWelcomeBlocks();
            fetchSheetData();
            setupAutoRefresh();
            switchTab(1);
        };
    </script>
</body>
</html>
