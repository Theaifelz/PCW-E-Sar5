<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบการประเมินคุณภาพภายนอก สมศ. รอบห้า | โรงเรียนปากชมวิทยา</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #fcfcf9; }
        .sticker-card { box-shadow: 0 0 0 5px #ffffff, 0 10px 20px rgba(148, 163, 184, 0.12); }
        .sticker-btn { box-shadow: 0 0 0 3px #ffffff, 0 4px 6px rgba(148, 163, 184, 0.15); }

        /* 10 Pastel Theme Styles for Welcome Blocks */
        .block-theme-lime { background: linear-gradient(135deg, #f7fee7, #ecfccb); border-color: #d9f99d; color: #365314; }
        .block-theme-gold { background: linear-gradient(135deg, #fefce8, #fef9c3); border-color: #fde047; color: #713f12; }
        .block-theme-teal { background: linear-gradient(135deg, #f0fdfa, #ccfbf1); border-color: #99f6e4; color: #134e4a; }
        .block-theme-lavender { background: linear-gradient(135deg, #faf5ff, #f3e8ff); border-color: #e9d5ff; color: #581c87; }
        .block-theme-rose { background: linear-gradient(135deg, #fff1f2, #ffe4e6); border-color: #fecdd3; color: #881337; }
        .block-theme-ocean { background: linear-gradient(135deg, #f0f9ff, #e0f2fe); border-color: #bae6fd; color: #0c4a6e; }
        .block-theme-sunset { background: linear-gradient(135deg, #fff7ed, #ffedd5); border-color: #fed7aa; color: #7c2d12; }
        .block-theme-emerald { background: linear-gradient(135deg, #ecfdf5, #d1fae5); border-color: #a7f3d0; color: #064e3b; }
        .block-theme-white { background: #ffffff; border-color: #e2e8f0; color: #1e293b; }
        .block-theme-dark { background: #1e2e22; border-color: #059669; color: #ecfdf5; }
    </style>
    <script>
        function convertDriveImageUrl(url) {
            if (!url || typeof url !== 'string') return '';
            url = url.trim();
            if (!url) return '';
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
            if (match && match[1] && (url.includes('drive.google.com') || url.includes('docs.google.com'))) {
                return 'https://lh3.googleusercontent.com/d/' + match[1];
            }
            return url;
        }

        function getGoogleDriveFileId(url) {
            if (!url) return null;
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
            return match ? match[1] : null;
        }

        function updateHeaderDOM() {
            const titleEl = document.getElementById("header-title-display");
            if (titleEl) titleEl.textContent = headerSettings.headerTitle || "ระบบประกันคุณภาพภายนอก (สมศ. รอบห้า)";

            const subtitleEl = document.getElementById("header-subtitle-display");
            if (subtitleEl) subtitleEl.textContent = headerSettings.headerSubtitle || "ศูนย์ข้อมูลเอกสารและหลักฐานเชิงประจักษ์ดิจิทัล";

            const schoolEls = document.querySelectorAll("#school-name-text, #footer-school-name, #card-school-name");
            schoolEls.forEach(el => el.textContent = headerSettings.schoolName || "โรงเรียนปากชมวิทยา");

            const logoImg = document.getElementById("logo-image-display");
            const logoFallback = document.getElementById("logo-icon-fallback");

            if (logoImg && logoFallback) {
                const directLogoUrl = convertDriveImageUrl(headerSettings.schoolLogo);
                if (directLogoUrl) {
                    logoImg.src = directLogoUrl;
                    logoImg.classList.remove("hidden");
                    logoFallback.classList.add("hidden");
                } else {
                    logoImg.classList.add("hidden");
                    logoFallback.classList.remove("hidden");
                }
            }
        }

        function loadEvaluatorData() {
            const savedHeader = localStorage.getItem("site_header_config");
            if (savedHeader) {
                try { headerSettings = Object.assign(headerSettings, JSON.parse(savedHeader)); } catch (e) {}
            }

            const savedSar = localStorage.getItem("sar_data_config");
            if (savedSar) {
                try { sarData = JSON.parse(savedSar); } catch (e) {}
            }

            const savedBlocks = localStorage.getItem("site_welcome_blocks_config");
            if (savedBlocks) {
                try { welcomeBlocks = JSON.parse(savedBlocks); } catch (e) {}
            }

            updateHeaderDOM();
            renderWelcomeBlocks();
        }

        function renderWelcomeBlocks() {
            const container = document.getElementById('welcome-blocks-display-container');
            if (!container) return;
            container.innerHTML = "";

            if (!Array.isArray(welcomeBlocks) || welcomeBlocks.length === 0) return;

            welcomeBlocks.forEach(block => {
                const div = document.createElement('div');
                const themeClass = `block-theme-${block.style || 'lime'}`;
                div.className = `${themeClass} p-6 md:p-8 rounded-3xl border-2 sticker-card space-y-4 transition-all`;

                let mediaHTML = "";
                if (block.type === 'image' && block.imageUrl) {
                    mediaHTML = `
                        <div class="mt-4 rounded-2xl overflow-hidden border border-black/10 max-h-80 flex justify-center bg-black/5">
                            <img src="${block.imageUrl}" class="w-full h-full object-contain max-h-80" alt="รูปภาพประกอบ">
                        </div>
                    `;
                } else if (block.type === 'vtr') {
                    if (block.videoType === 'local' && block.videoData) {
                        mediaHTML = `
                            <div class="mt-4 rounded-2xl overflow-hidden border border-black/10 aspect-video bg-black flex items-center justify-center">
                                <video src="${block.videoData}" controls class="w-full h-full object-contain"></video>
                            </div>
                        `;
                    } else if (block.videoUrl) {
                        let ytEmbedUrl = block.videoUrl;
                        if (ytEmbedUrl.includes('watch?v=')) {
                            ytEmbedUrl = ytEmbedUrl.replace('watch?v=', 'embed/');
                        } else if (ytEmbedUrl.includes('youtu.be/')) {
                            ytEmbedUrl = ytEmbedUrl.replace('youtu.be/', 'www.youtube.com/embed/');
                        }
                        mediaHTML = `
                            <div class="mt-4 rounded-2xl overflow-hidden border border-black/10 aspect-video bg-black">
                                <iframe src="${ytEmbedUrl}" class="w-full h-full border-none" allowfullscreen></iframe>
                            </div>
                        `;
                    }
                }

                let buttonHTML = "";
                if (block.showBtn) {
                    const btnLabel = block.btnLabel && block.btnLabel.trim() !== "" ? block.btnLabel : "ดูข้อมูลเพิ่มเติม";
                    const btnUrl = block.btnUrl && block.btnUrl.trim() !== "" ? block.btnUrl : "#";
                    buttonHTML = `
                        <div class="pt-2">
                            <a href="${btnUrl}" target="_blank" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl text-xs font-bold bg-white/80 hover:bg-white text-slate-800 border border-black/10 shadow-sm transition-all active:scale-95">
                                <i class="fa-solid fa-arrow-up-right-from-square"></i> ${btnLabel}
                            </a>
                        </div>
                    `;
                }

                div.innerHTML = `
                    <div class="flex items-center gap-3 border-b border-black/10 pb-3">
                        <div class="w-10 h-10 rounded-2xl bg-white/80 flex items-center justify-center text-lg shadow-sm flex-shrink-0">
                            <i class="fa-solid ${block.icon || 'fa-bullhorn'}"></i>
                        </div>
                        <div>
                            <span class="text-[10px] font-black uppercase tracking-wider opacity-75 block">${block.subtitle || 'ข่าวสารและต้อนรับ'}</span>
                            <h2 class="font-extrabold text-base md:text-lg leading-snug">${block.title || 'ข้อความต้อนรับ'}</h2>
                        </div>
                    </div>
                    <p class="text-xs md:text-sm font-medium leading-relaxed whitespace-pre-line opacity-90">${block.body || ''}</p>
                    ${mediaHTML}
                    ${buttonHTML}
                `;

                container.appendChild(div);
            });
        }

        function switchTab(tabId) {
            activeStandardId = tabId;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn px-6 py-3.5 rounded-2xl text-sm md:text-base font-bold transition-all duration-300 bg-white text-slate-600 hover:bg-slate-50 border border-slate-200";
            });
            const activeBtn = document.getElementById(`tab-btn-${tabId}`);
            if (activeBtn) activeBtn.className = "tab-btn px-6 py-3.5 rounded-2xl text-sm md:text-base font-bold transition-all duration-300 bg-[#0d9488] text-white sticker-btn scale-105";

            renderStandard(tabId);
        }

        function renderStandard(standardId) {
            const container = document.getElementById('accordion-container');
            if (!container) return;
            container.innerHTML = '';
            const key = String(standardId);
            const targetData = sarData[key] || [];

            if (targetData.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-8 rounded-3xl text-center border-2 border-dashed border-slate-200">
                        <i class="fa-solid fa-folder-open text-slate-300 text-4xl mb-2"></i>
                        <p class="text-slate-500 font-bold text-sm">ยังไม่มีข้อมูลในมาตรฐานนี้</p>
                    </div>
                `;
                return;
            }

            targetData.forEach((item, topicIndex) => {
                const uniqueId = `std-${standardId}-${topicIndex}`;
                const itemDiv = document.createElement('div');
                itemDiv.className = "bg-white border-2 border-white rounded-3xl overflow-hidden sticker-card mb-4";

                const docs = Array.isArray(item.documents) ? item.documents : [];
                const docRows = docs.map((doc, docIndex) => `
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-4 bg-white border border-slate-100 rounded-2xl gap-3">
                        <span class="text-xs md:text-sm text-slate-700 font-bold flex items-center">
                            <i class="fa-solid fa-file-pdf text-rose-500 mr-3 text-lg"></i>${doc.name}
                        </span>
                        
                        <button onclick="openDocumentModal(${topicIndex}, ${docIndex})" class="px-5 py-2.5 bg-gradient-to-r from-emerald-600 to-[#0d9488] hover:from-emerald-700 hover:to-[#0f766e] text-white text-xs font-extrabold rounded-xl transition-all flex items-center gap-2 shadow-sm self-end sm:self-auto flex-shrink-0 active:scale-95">
                            <i class="fa-regular fa-eye text-sm"></i> ดูเอกสาร
                        </button>
                    </div>
                `).join('');

                itemDiv.innerHTML = `
                    <div onclick="toggleAccordion('${uniqueId}')" class="w-full flex justify-between items-center p-5 font-bold text-slate-800 cursor-pointer">
                        <span class="text-xs md:text-sm flex items-center">
                            <i class="fa-solid fa-circle-check text-[#84cc16] mr-3 text-xl"></i>${item.title}
                        </span>
                        <i id="icon-${uniqueId}" class="fa-solid fa-chevron-down text-slate-400 bg-slate-100 p-2.5 rounded-full text-xs"></i>
                    </div>
                    <div id="content-${uniqueId}" class="hidden border-t border-slate-100 bg-[#f8fafc] p-5 space-y-3">
                        ${docs.length > 0 ? docRows : '<p class="text-xs text-slate-400 font-bold text-center py-2">ไม่มีไฟล์เอกสาร</p>'}
                    </div>
                `;
                container.appendChild(itemDiv);
            });
        }

        function toggleAccordion(id) {
            const content = document.getElementById(`content-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            if (content && icon) {
                content.classList.toggle('hidden');
                icon.classList.toggle('rotate-180');
            }
        }

        function openDocumentModal(topicIdx, docIdx) {
            const key = String(activeStandardId);
            const doc = sarData[key]?.[topicIdx]?.documents?.[docIdx];
            if (!doc) return;

            activeDocumentName = doc.name;
            activeDocumentUrl = doc.url || DEFAULT_DRIVE_LINK;

            const modal = document.getElementById('pdf-viewer-modal');
            const modalTitle = document.getElementById('pdf-modal-title');
            const mockTitle = document.getElementById('pdf-mock-title');
            const downloadDocTitle = document.getElementById('download-doc-title');
            const cardStdTitle = document.getElementById('card-std-title');
            const iframe = document.getElementById('pdf-viewer-iframe');
            const mockPreview = document.getElementById('pdf-mock-preview');

            if (modalTitle) modalTitle.innerText = activeDocumentName;
            if (mockTitle) mockTitle.innerText = activeDocumentName;
            if (downloadDocTitle) downloadDocTitle.innerText = activeDocumentName;
            if (cardStdTitle) cardStdTitle.innerText = `มาตรฐานที่ ${activeStandardId}`;

            const fileId = getGoogleDriveFileId(activeDocumentUrl);

            if (fileId) {
                iframe.src = `https://drive.google.com/file/d/${fileId}/preview`;
                iframe.classList.remove('hidden');
                mockPreview.classList.add('hidden');
            } else {
                iframe.src = "";
                iframe.classList.add('hidden');
                mockPreview.classList.remove('hidden');
            }

            switchModalTab('preview');
            modal.classList.remove('hidden');
        }

        function switchModalTab(tabName) {
            const btnPreview = document.getElementById('modal-tab-btn-preview');
            const btnDownload = document.getElementById('modal-tab-btn-download');
            const contentPreview = document.getElementById('modal-tab-content-preview');
            const contentDownload = document.getElementById('modal-tab-content-download');

            if (tabName === 'preview') {
                btnPreview.className = "flex-1 py-2.5 px-4 rounded-xl text-xs md:text-sm font-extrabold transition-all flex items-center justify-center gap-2 bg-[#0d9488] text-white shadow-sm";
                btnDownload.className = "flex-1 py-2.5 px-4 rounded-xl text-xs md:text-sm font-extrabold transition-all flex items-center justify-center gap-2 bg-white text-slate-600 border border-slate-200 hover:bg-slate-50";
                contentPreview.classList.remove('hidden');
                contentDownload.classList.add('hidden');
            } else {
                btnDownload.className = "flex-1 py-2.5 px-4 rounded-xl text-xs md:text-sm font-extrabold transition-all flex items-center justify-center gap-2 bg-[#0d9488] text-white shadow-sm";
                btnPreview.className = "flex-1 py-2.5 px-4 rounded-xl text-xs md:text-sm font-extrabold transition-all flex items-center justify-center gap-2 bg-white text-slate-600 border border-slate-200 hover:bg-slate-50";
                contentDownload.classList.remove('hidden');
                contentPreview.classList.add('hidden');
            }
        }

        function downloadDirectlyFromModal() {
            const targetUrl = (activeDocumentUrl && activeDocumentUrl.trim() !== "") ? activeDocumentUrl : DEFAULT_DRIVE_LINK;
            window.open(targetUrl, '_blank');
        }

        function closePdfViewerModal() {
            document.getElementById('pdf-viewer-modal').classList.add('hidden');
            document.getElementById('pdf-viewer-iframe').src = "";
        }

        window.onload = function() {
            loadEvaluatorData();
            fetchSheetData();
            switchTab(1);
        };
    </script>
</body>
</html>
