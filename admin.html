<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบการประเมินคุณภาพภายนอก สมศ. รอบห้า | โรงเรียนปากชมวิทยา (แผงแอดมิน)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #fcfcf9; }
        .sticker-card { box-shadow: 0 0 0 5px #ffffff, 0 10px 20px rgba(148, 163, 184, 0.12); }
        .sticker-btn { box-shadow: 0 0 0 3px #ffffff, 0 4px 6px rgba(148, 163, 184, 0.15); }

        /* 10 Pastel Theme Styles */
        .block-theme-lime { background: linear-gradient(135deg, #f7fee7, #ecfccb); border-color: #d9f99d; color: #365314; }
        .block-theme-gold { background: linear-gradient(135deg, #fefce8, #fef9c3); border-color: #fde047; color: #713f12; }
        .block-theme-teal { background: linear-gradient(135deg, #f0fdfa, #ccfbf1); border-color: #99f6e4; color: #134e4a; }
        .block-theme-lavender { background: linear-gradient(135deg, #faf5ff, #f3e8ff); border-color: #e9d5ff; color: #581c87; }
        .block-theme-rose { background: linear-gradient(135deg, #fff1f2, #ffe4e6); border-color: #fecdd3; color: #881337; }
        .block-theme-ocean { background: linear-gradient(135deg, #f0f9ff, #e0f2fe); border-color: #bae6fd; color: #0c4a6e; }
        .block-theme-sunset { background: linear-gradient(135deg, #fff7ed, #ffedd5); border-color: #fed7aa; color: #7c2d12; }
        .block-theme-emerald { background: linear-gradient(135deg, #ecfdf5, #d1fae5); border-color: #a7f3d0; color: #064e3b; }
        .block-theme-white { background: #ffffff; border-color: #e2e8f0; color: #1e293b; }
        .block-theme-dark { background: #1e2e22; border-color: #059669; color: #ecfdf5; }
    </style>
    <script>
        function convertDriveImageUrl(url) {
            if (!url || typeof url !== 'string') return '';
            url = url.trim();
            if (!url) return '';
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
            if (match && match[1] && (url.includes('drive.google.com') || url.includes('docs.google.com'))) {
                return 'https://lh3.googleusercontent.com/d/' + match[1];
            }
            return url;
        }

        function liveUpdateHeader() {
            headerSettings.schoolName = document.getElementById('builder-school-name').value.trim();
            headerSettings.schoolLogo = document.getElementById('builder-school-logo').value.trim();
            headerSettings.headerTitle = document.getElementById('builder-header-title').value.trim();
            headerSettings.headerSubtitle = document.getElementById('builder-header-subtitle').value.trim();

            document.getElementById("header-title-display").textContent = headerSettings.headerTitle || "ระบบประกันคุณภาพภายนอก (สมศ. รอบห้า)";
            document.getElementById("header-subtitle-display").textContent = headerSettings.headerSubtitle || "ศูนย์ข้อมูลเอกสารและหลักฐานเชิงประจักษ์ดิจิทัล";

            document.querySelectorAll("#school-name-text").forEach(el => el.textContent = headerSettings.schoolName || "โรงเรียนปากชมวิทยา");

            const logoImg = document.getElementById("logo-image-display");
            const logoFallback = document.getElementById("logo-icon-fallback");

            if (logoImg && logoFallback) {
                const directLogoUrl = convertDriveImageUrl(headerSettings.schoolLogo);
                if (directLogoUrl) {
                    logoImg.src = directLogoUrl;
                    logoImg.classList.remove("hidden");
                    logoFallback.classList.add("hidden");
                } else {
                    logoImg.classList.add("hidden");
                    logoFallback.classList.remove("hidden");
                }
            }
        }

        function saveHeaderSettings() {
            liveUpdateHeader();
            localStorage.setItem("site_header_config", JSON.stringify(headerSettings));
            syncDataToGoogleSheets();
        }

        function loadWelcomeBlocks() {
            const savedBlocks = localStorage.getItem("site_welcome_blocks_config");
            if (savedBlocks) {
                try { welcomeBlocks = JSON.parse(savedBlocks); } catch (e) {}
            }
            renderWelcomeBlocksListAdmin();
        }

        function renderWelcomeBlocksListAdmin() {
            const container = document.getElementById('welcome-blocks-list');
            if (!container) return;
            container.innerHTML = "";

            if (!Array.isArray(welcomeBlocks) || welcomeBlocks.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 font-bold text-center py-4">ยังไม่มีบล็อกข้อความต้อนรับ กดปุ่มด้านบนเพื่อเพิ่มบล็อกใหม่</p>`;
                return;
            }

            welcomeBlocks.forEach((block, idx) => {
                const div = document.createElement('div');
                div.className = "p-4 bg-slate-50 rounded-2xl border border-slate-200 flex justify-between items-center gap-3";
                div.innerHTML = `
                    <div class="flex items-center gap-3 truncate">
                        <div class="w-8 h-8 rounded-xl bg-white border border-slate-200 flex items-center justify-center text-slate-700 flex-shrink-0 text-sm">
                            <i class="fa-solid ${block.icon || 'fa-bullhorn'}"></i>
                        </div>
                        <div class="truncate">
                            <h4 class="font-bold text-xs md:text-sm text-slate-800 truncate">${block.title || 'ไม่มีหัวข้อ'}</h4>
                            <p class="text-[10px] text-slate-400 font-medium truncate">${block.subtitle || 'บล็อกข้อความ'}</p>
                        </div>
                    </div>
                    <button onclick="openEditBlockModal(${idx})" class="px-3 py-1.5 bg-white text-slate-700 text-xs font-bold rounded-xl border border-slate-200 hover:bg-slate-100 transition-all flex-shrink-0">
                        <i class="fa-solid fa-pen-to-square mr-1"></i> แก้ไข
                    </button>
                `;
                container.appendChild(div);
            });
        }

        function openAddBlockModal() {
            document.getElementById('edit-block-id').value = "";
            document.getElementById('block-modal-title').innerText = "เพิ่มบล็อกข้อความต้อนรับใหม่";
            document.getElementById('block-type').value = "text";
            document.getElementById('block-style').value = "lime";
            document.getElementById('block-icon').value = "fa-bullhorn";
            document.getElementById('block-subtitle').value = "";
            document.getElementById('block-title').value = "";
            document.getElementById('block-body').value = "";
            document.getElementById('block-image-url').value = "";
            document.getElementById('block-video-url').value = "";
            document.getElementById('block-show-btn').checked = false;
            document.getElementById('block-btn-label').value = "";
            document.getElementById('block-btn-url').value = "";
            document.getElementById('btn-delete-block').classList.add('hidden');

            toggleBlockFields();
            toggleBtnFields();
            document.getElementById('welcome-block-modal').classList.remove('hidden');
        }

        function openEditBlockModal(index) {
            const block = welcomeBlocks[index];
            if (!block) return;

            document.getElementById('edit-block-id').value = index;
            document.getElementById('block-modal-title').innerText = "แก้ไขบล็อกข้อความต้อนรับ";
            document.getElementById('block-type').value = block.type || "text";
            document.getElementById('block-style').value = block.style || "lime";
            document.getElementById('block-icon').value = block.icon || "fa-bullhorn";
            document.getElementById('block-subtitle').value = block.subtitle || "";
            document.getElementById('block-title').value = block.title || "";
            document.getElementById('block-body').value = block.body || "";
            document.getElementById('block-image-url').value = block.imageUrl || "";
            document.getElementById('block-video-url').value = block.videoUrl || "";
            document.getElementById('block-show-btn').checked = !!block.showBtn;
            document.getElementById('block-btn-label').value = block.btnLabel || "";
            document.getElementById('block-btn-url').value = block.btnUrl || "";
            document.getElementById('btn-delete-block').classList.remove('hidden');

            toggleBlockFields();
            toggleBtnFields();
            document.getElementById('welcome-block-modal').classList.remove('hidden');
        }

        function closeBlockModal() {
            document.getElementById('welcome-block-modal').classList.add('hidden');
        }

        function toggleBlockFields() {
            const type = document.getElementById('block-type').value;
            const imgBox = document.getElementById('field-image-container');
            const vtrBox = document.getElementById('field-vtr-container');

            if (type === 'image') {
                imgBox.classList.remove('hidden');
                vtrBox.classList.add('hidden');
            } else if (type === 'vtr') {
                imgBox.classList.add('hidden');
                vtrBox.classList.remove('hidden');
            } else {
                imgBox.classList.add('hidden');
                vtrBox.classList.add('hidden');
            }
        }

        function toggleBtnFields() {
            const showBtn = document.getElementById('block-show-btn').checked;
            const btnBox = document.getElementById('btn-config-fields');
            if (showBtn) btnBox.classList.remove('hidden');
            else btnBox.classList.add('hidden');
        }

        function saveWelcomeBlock() {
            const idxVal = document.getElementById('edit-block-id').value;
            const blockData = {
                type: document.getElementById('block-type').value,
                style: document.getElementById('block-style').value,
                icon: document.getElementById('block-icon').value,
                subtitle: document.getElementById('block-subtitle').value.trim(),
                title: document.getElementById('block-title').value.trim(),
                body: document.getElementById('block-body').value.trim(),
                imageUrl: document.getElementById('block-image-url').value.trim(),
                videoUrl: document.getElementById('block-video-url').value.trim(),
                showBtn: document.getElementById('block-show-btn').checked,
                btnLabel: document.getElementById('block-btn-label').value.trim(),
                btnUrl: document.getElementById('block-btn-url').value.trim()
            };

            if (!blockData.title) {
                showToast("กรุณากรอกหัวข้อหลักของกล่องข้อความ", false);
                return;
            }

            if (idxVal === "") {
                welcomeBlocks.push(blockData);
            } else {
                const idx = parseInt(idxVal);
                welcomeBlocks[idx] = blockData;
            }

            localStorage.setItem("site_welcome_blocks_config", JSON.stringify(welcomeBlocks));
            closeBlockModal();
            renderWelcomeBlocksListAdmin();
            syncDataToGoogleSheets();
        }

        function confirmDeleteCurrentBlock() {
            const idxVal = document.getElementById('edit-block-id').value;
            if (idxVal !== "") {
                showConfirmModal("ลบบล็อกข้อความต้อนรับ", "คุณแน่ใจหรือไม่ว่าต้องการลบบล็อกข้อความนี้?", function() {
                    const idx = parseInt(idxVal);
                    welcomeBlocks.splice(idx, 1);
                    localStorage.setItem("site_welcome_blocks_config", JSON.stringify(welcomeBlocks));
                    closeBlockModal();
                    renderWelcomeBlocksListAdmin();
                    syncDataToGoogleSheets();
                });
            }
        }

        function calculateDynamicProgress() {
            try {
                let totalDocsCount = 0;
                let uploadedDocsCount = 0;
                let mCount = { '1': { total: 0, uploaded: 0 }, '2': { total: 0, uploaded: 0 }, '3': { total: 0, uploaded: 0 } };

                for (let stdId = 1; stdId <= 3; stdId++) {
                    const key = String(stdId);
                    const targetData = sarData[key] || [];
                    if (Array.isArray(targetData)) {
                        targetData.forEach(topic => {
                            const docs = topic && Array.isArray(topic.documents) ? topic.documents : [];
                            docs.forEach(doc => {
                                totalDocsCount++;
                                mCount[key].total++;
                                if (doc && doc.url && typeof doc.url === 'string' && doc.url.trim() !== "") {
                                    uploadedDocsCount++;
                                    mCount[key].uploaded++;
                                }
                            });
                        });
                    }
                }

                const totalPercent = totalDocsCount > 0 ? Math.round((uploadedDocsCount / totalDocsCount) * 100) : 0;
                const m1Percent = mCount['1'].total > 0 ? Math.round((mCount['1'].uploaded / mCount['1'].total) * 100) : 0;
                const m2Percent = mCount['2'].total > 0 ? Math.round((mCount['2'].uploaded / mCount['2'].total) * 100) : 0;
                const m3Percent = mCount['3'].total > 0 ? Math.round((mCount['3'].uploaded / mCount['3'].total) * 100) : 0;

                document.getElementById('progress-total-percentage').textContent = `${totalPercent}%`;
                document.getElementById('progress-m1-text').textContent = `${m1Percent}%`;
                document.getElementById('progress-m2-text').textContent = `${m2Percent}%`;
                document.getElementById('progress-m3-text').textContent = `${m3Percent}%`;

                const arcLength = 125.66;
                document.getElementById('total-gauge-arc').style.strokeDashoffset = (arcLength * (1 - totalPercent / 100)).toFixed(2);
                document.getElementById('m1-gauge-arc').style.strokeDashoffset = (arcLength * (1 - m1Percent / 100)).toFixed(2);
                document.getElementById('m2-gauge-arc').style.strokeDashoffset = (arcLength * (1 - m2Percent / 100)).toFixed(2);
                document.getElementById('m3-gauge-arc').style.strokeDashoffset = (arcLength * (1 - m3Percent / 100)).toFixed(2);

                const badgeText = document.getElementById('overall-status-text');
                if (badgeText) {
                    if (totalPercent >= 100) badgeText.innerText = "⭐ สมบูรณ์พร้อมรับการตรวจประเมิน";
                    else if (totalPercent >= 50) badgeText.innerText = "⏳ เอกสารพร้อมแล้วกว่าครึ่งหนึ่ง";
                    else badgeText.innerText = "📁 อยู่ระหว่างจัดเตรียมและอัปโหลดไฟล์";
                }
            } catch (e) {}
        }

        function switchTab(tabId) {
            activeStandardId = tabId;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn px-4 md:px-5 py-3 rounded-2xl text-xs md:text-sm font-bold transition-all duration-300 bg-white text-slate-600 hover:bg-slate-50 border border-slate-200";
            });
            const activeBtn = document.getElementById(`tab-btn-${tabId}`);
            if (activeBtn) activeBtn.className = "tab-btn px-4 md:px-5 py-3 rounded-2xl text-xs md:text-sm font-bold transition-all duration-300 bg-[#0d9488] text-white sticker-btn scale-105";

            const standardsContainer = document.getElementById('standards-container');
            const builderContainer = document.getElementById('builder-container');

            if (tabId === 4) {
                standardsContainer.classList.add('hidden');
                builderContainer.classList.remove('hidden');
                loadHeaderSettings();
                loadWelcomeBlocks();
            } else {
                standardsContainer.classList.remove('hidden');
                builderContainer.classList.add('hidden');
                renderStandard(tabId);
            }
        }

        function renderStandard(standardId) {
            const container = document.getElementById('accordion-container');
            if (!container) return;
            container.innerHTML = '';
            const key = String(standardId);
            const targetData = sarData[key] || [];

            targetData.forEach((item, topicIndex) => {
                const uniqueId = `std-${standardId}-${topicIndex}`;
                const itemDiv = document.createElement('div');
                itemDiv.className = "bg-white border-2 border-white rounded-3xl overflow-hidden sticker-card mb-4";
                
                const docs = Array.isArray(item.documents) ? item.documents : [];
                const docRows = docs.map((doc, docIndex) => `
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-3.5 bg-white border border-slate-100 rounded-2xl gap-2">
                        <span class="text-xs md:text-sm text-slate-700 font-bold flex items-center">
                            <i class="fa-solid fa-file-pdf text-rose-500 mr-2.5 text-base"></i>${doc.name}
                        </span>
                        
                        <div class="flex items-center gap-1.5 self-end sm:self-auto flex-shrink-0">
                            <button onclick="openEditDocModal(${topicIndex}, ${docIndex})" class="px-3 py-1.5 bg-slate-50 text-slate-600 text-xs font-bold rounded-xl border border-slate-200 hover:bg-slate-100 transition-all">
                                <i class="fa-solid fa-pen-to-square"></i> แก้ไข
                            </button>
                        </div>
                    </div>
                `).join('');

                itemDiv.innerHTML = `
                    <div class="w-full flex justify-between items-center p-5 font-bold text-slate-800 bg-slate-50/50 border-b border-slate-100">
                        <div class="flex items-center gap-3 cursor-pointer" onclick="toggleAccordion('${uniqueId}')">
                            <i id="icon-${uniqueId}" class="fa-solid fa-chevron-down text-slate-400 bg-white p-2 rounded-full text-xs border border-slate-200 transition-transform"></i>
                            <span class="text-xs md:text-sm text-slate-800 font-extrabold">${item.title}</span>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button onclick="openEditTopicModal(${topicIndex})" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition-all border border-slate-200">
                                <i class="fa-solid fa-pen-to-square mr-1"></i> แก้ไขหัวข้อ
                            </button>
                            <button onclick="openAddDocModal(${topicIndex})" class="px-3 py-1.5 bg-[#0d9488] text-white text-xs font-bold rounded-xl shadow-sm hover:bg-[#0f766e] transition-all">
                                <i class="fa-solid fa-plus mr-1"></i> เพิ่มไฟล์
                            </button>
                            <button onclick="confirmDeleteTopicItem(${topicIndex})" class="p-1.5 text-slate-400 hover:text-rose-500 rounded-xl transition-all">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                    <div id="content-${uniqueId}" class="hidden border-t border-slate-100 bg-[#f8fafc] p-5 space-y-2.5">
                        ${docs.length > 0 ? docRows : '<p class="text-xs text-slate-400 font-bold text-center py-2">ยังไม่มีไฟล์เอกสารในกลุ่มหัวข้อนี้</p>'}
                    </div>
                `;
                container.appendChild(itemDiv);
            });

            calculateDynamicProgress();
        }

        function openEditTopicModal(topicIdx) {
            const key = String(activeStandardId);
            const targetTopic = sarData[key] ? sarData[key][topicIdx] : null;
            if (!targetTopic) return;
            document.getElementById('edit-topic-idx').value = topicIdx;
            document.getElementById('edit-topic-title-input').value = targetTopic.title || "";
            document.getElementById('edit-topic-modal').classList.remove('hidden');
        }

        function closeEditTopicModal() {
            document.getElementById('edit-topic-modal').classList.add('hidden');
        }

        function saveTopicTitleEdit() {
            const topicIdx = parseInt(document.getElementById('edit-topic-idx').value);
            const titleVal = document.getElementById('edit-topic-title-input').value.trim();

            if (!titleVal) {
                showToast("กรุณากรอกชื่อประเด็นพิจารณา", false);
                return;
            }

            const key = String(activeStandardId);
            if (sarData[key] && sarData[key][topicIdx]) {
                sarData[key][topicIdx].title = titleVal;
                localStorage.setItem("sar_data_config", JSON.stringify(sarData));
                closeEditTopicModal();
                renderStandard(activeStandardId);
                syncDataToGoogleSheets();
                showToast("แก้ไขชื่อประเด็นพิจารณาเรียบร้อยแล้ว");
            }
        }

        function openAddDocModal(topicIdx) {
            document.getElementById('edit-doc-modal-title').innerText = "เพิ่มเอกสารเชิงประจักษ์ใหม่";
            document.getElementById('edit-doc-topic-idx').value = topicIdx;
            document.getElementById('edit-doc-doc-idx').value = "";
            document.getElementById('edit-doc-name').value = "";
            document.getElementById('edit-doc-url').value = "";
            document.getElementById('btn-delete-doc').classList.add('hidden');
            document.getElementById('edit-doc-modal').classList.remove('hidden');
        }

        function openEditDocModal(topicIdx, docIdx) {
            const key = String(activeStandardId);
            const targetDoc = sarData[key][topicIdx].documents[docIdx];
            document.getElementById('edit-doc-modal-title').innerText = "แก้ไขข้อมูลเอกสารหลักฐาน";
            document.getElementById('edit-doc-topic-idx').value = topicIdx;
            document.getElementById('edit-doc-doc-idx').value = docIdx;
            document.getElementById('edit-doc-name').value = targetDoc.name || "";
            document.getElementById('edit-doc-url').value = targetDoc.url || "";
            document.getElementById('btn-delete-doc').classList.remove('hidden');
            document.getElementById('edit-doc-modal').classList.remove('hidden');
        }

        function closeEditDocModal() {
            document.getElementById('edit-doc-modal').classList.add('hidden');
        }

        function saveDocItemEdits() {
            const topicIdx = parseInt(document.getElementById('edit-doc-topic-idx').value);
            const docIdxVal = document.getElementById('edit-doc-doc-idx').value;
            const nameVal = document.getElementById('edit-doc-name').value.trim();
            const urlVal = document.getElementById('edit-doc-url').value.trim();

            if (!nameVal) {
                showToast("กรุณากรอกชื่อเอกสาร", false);
                return;
            }

            const key = String(activeStandardId);
            if (!sarData[key][topicIdx].documents) sarData[key][topicIdx].documents = [];

            if (docIdxVal === "") {
                sarData[key][topicIdx].documents.push({ name: nameVal, url: urlVal });
            } else {
                const docIdx = parseInt(docIdxVal);
                sarData[key][topicIdx].documents[docIdx] = { name: nameVal, url: urlVal };
            }

            localStorage.setItem("sar_data_config", JSON.stringify(sarData));
            closeEditDocModal();
            renderStandard(activeStandardId);
            syncDataToGoogleSheets();
        }

        function confirmDeleteDocItem() {
            const topicIdx = parseInt(document.getElementById('edit-doc-topic-idx').value);
            const docIdx = parseInt(document.getElementById('edit-doc-doc-idx').value);
            
            showConfirmModal("ลบไฟล์เอกสาร", "คุณแน่ใจหรือไม่ว่าต้องการลบไฟล์เอกสารนี้?", function() {
                const key = String(activeStandardId);
                sarData[key][topicIdx].documents.splice(docIdx, 1);
                localStorage.setItem("sar_data_config", JSON.stringify(sarData));
                closeEditDocModal();
                renderStandard(activeStandardId);
                syncDataToGoogleSheets();
            });
        }

        function openAddTopicModal() {
            const topicTitle = prompt("กรุณากรอกชื่อประเด็นพิจารณา / ตัวชี้วัดใหม่:");
            if (topicTitle && topicTitle.trim() !== "") {
                const key = String(activeStandardId);
                if (!sarData[key]) sarData[key] = [];
                sarData[key].push({ title: topicTitle.trim(), documents: [] });
                localStorage.setItem("sar_data_config", JSON.stringify(sarData));
                renderStandard(activeStandardId);
                syncDataToGoogleSheets();
            }
        }

        function confirmDeleteTopicItem(topicIdx) {
            showConfirmModal("ลบประเด็นพิจารณา", "คุณแน่ใจหรือไม่ว่าต้องการลบประเด็นพิจารณานี้พร้อมเอกสารย่อยทั้งหมด?", function() {
                const key = String(activeStandardId);
                sarData[key].splice(topicIdx, 1);
                localStorage.setItem("sar_data_config", JSON.stringify(sarData));
                renderStandard(activeStandardId);
                syncDataToGoogleSheets();
            });
        }

        window.onload = function() {
            const savedHeader = localStorage.getItem("site_header_config");
            if (savedHeader) {
                try { headerSettings = Object.assign(headerSettings, JSON.parse(savedHeader)); } catch (e) {}
            }
            const savedSar = localStorage.getItem("sar_data_config");
            if (savedSar) {
